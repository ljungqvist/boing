# Build the Android app and attach the APK to the workflow run:
#   push to main → artifact "boing-main-apk"
#   push to dev  → artifact "boing-dev-apk"
# Download it from the run's page (Actions → run → Artifacts; needs a GitHub login).
# Builds of main and dev are also published as a plain .apk on a rolling GitHub release
# (no login needed), replaced on every build:
#   main → https://github.com/ljungqvist/boing/releases/latest/download/boing.apk
#   dev  → https://github.com/ljungqvist/boing/releases/download/dev-latest/boing-dev.apk
# The APK is the Expo template's release build, signed with the debug key: it installs
# on a phone but isn't a store/production build. "Run workflow" builds the selected branch.
name: Build Android APK

on:
  push:
    branches: [main, dev]
    paths:
      - mobile/**
      - src/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write # publish the rolling release

# Build number and commit: Android's version and the "Build" row in the app's settings (mobile/app.config.js).
env:
  EXPO_PUBLIC_BOING_BUILD: ${{ github.run_number }}
  EXPO_PUBLIC_BOING_BRANCH: ${{ github.ref_name }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Short commit
        run: echo "EXPO_PUBLIC_BOING_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the android/ project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: mobile/android
        env:
          # Upload key for https://ljungqvist.info/boing (tools/kapsi.sh key), inlined into the JS bundle.
          EXPO_PUBLIC_BOING_UPLOAD_KEY: ${{ secrets.BOING_UPLOAD_KEY }}
        # 2 GB heap (the prebuild default) ran out in mergeDexRelease on 2026-10-24; runners have 16 GB.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Artifact names can't contain "/" (branches like claude/…): replaced by "-".
      - name: Artifact name
        id: artifact
        run: echo "name=boing-${GITHUB_REF_NAME//\//-}-apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = main ]; then
            tag=main-latest; apk=boing.apk; flags=--latest
          else
            tag=dev-latest; apk=boing-dev.apk; flags="--prerelease --latest=false"
          fi
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Recreate the release so its tag points at this commit; the download URL stays the same.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "$apk" $flags --target "$GITHUB_SHA" \
            --title "Boing $BRANCH build" \
            --notes "Latest Android build of \`$BRANCH\` ($GITHUB_SHA), replaced on every build. Signed with the debug key: installs on a phone, not a store build."
